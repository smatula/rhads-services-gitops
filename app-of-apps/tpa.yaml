apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tpa-service
  namespace: gitops-resources
  annotations:
    argocd.argoproj.io/refresh: "hard"
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            cluster-service-app: "true"
  template:
    metadata:
      name: 'tpa'
      namespace: gitops-resources
    spec:
      project: gitops-resources
      destination:
        server: https://kubernetes.default.svc
        namespace: tssc-tpa
      source:
        repoURL: https://github.com/smatula/rhads-services-gitops
        path: ./components/tpa
        targetRevision: tas-tpa-keycloak
        kustomize:
          patches:
            # Validation note: Ensure target resources meet expected structure:
            # - Application trusted-profile-analyzer: source.helm.parameters length == 2
            - patch: |
                - op: replace
                  path: /spec/source/helm/parameters/0/value
                  # Helm parameter 0 = AppDomain (e.g., "tpa.example.com")
                  value: "{{ index .metadata.annotations "AppDomain" }}"
              target:
                kind: Application
                name: trusted-profile-analyzer
            - patch: |
                - op: replace
                  path: /spec/source/helm/parameters/1/value
                  # Helm parameter 1 = OIDCissuer (Keycloak realm issuer URL)
                  value: "{{ index .metadata.annotations "OIDCissuer" }}"
              target:
                kind: Application
                name: trusted-profile-analyzer
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            argocd.argoproj.io/managed-by: openshift-gitops
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - ApplyOutOfSyncOnly=true
