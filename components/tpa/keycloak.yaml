apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-foundation
  namespace: gitops-resources
spec:
  destination:
    namespace: tssc-keycloak
    server: https://kubernetes.default.svc
  project: gitops-resources
  source:
    path: ./components/tpa/keycloak
    repoURL: https://github.com/smatula/rhads-services-gitops
    targetRevision: oneAppSet
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
