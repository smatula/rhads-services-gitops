---
# ArgoCD Sync Hook - Generates secrets during deployment
#
# This hook generates 2 secrets with passwords and credentials at runtime.
# It preserves existing passwords (idempotent) if secrets already exist.
#
# Runs in sync-wave 1 (after RBAC resources in wave 0, before app resources in wave 2+)
apiVersion: batch/v1
kind: Job
metadata:
  name: tas-generate-secrets
  namespace: trusted-artifact-signer
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      name: tas-generate-secrets
    spec:
      restartPolicy: Never
      serviceAccountName: tas-secret-generator
      containers:
        - name: generator
          image: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              echo "========================================"
              echo "TAS Secret Generator - Starting"
              echo "========================================"

              # Set namespace variables
              TAS_NAMESPACE="trusted-artifact-signer"
              KEYCLOAK_NAMESPACE="tssc-keycloak"
              REALM="trusted-artifact-signer"

              echo "Configuration:"
              echo "  TAS Namespace: $TAS_NAMESPACE"
              echo "  Keycloak Namespace: $KEYCLOAK_NAMESPACE"
              echo "  Realm: $REALM"
              echo ""

              # Get ingress domain
              echo "Querying cluster for ingress domain..."
              INGRESS_DOMAIN=$(oc -n openshift-ingress-operator get ingresscontrollers.operator.openshift.io default -o jsonpath='{.status.domain}')
              echo "  Ingress Domain: $INGRESS_DOMAIN"
              echo ""

              # Derive values for secret generation
              TAS_EMAIL="trusted-artifact-signer@${INGRESS_DOMAIN}"
              echo ""

              echo "Checking if secrets already exist..."

              # Check each secret individually for better debug output
              TAS_USER_EXISTS=false
              TAS_CLIENTS_EXISTS=false

              if oc get secret trusted-artifact-signer-user -n "$TAS_NAMESPACE" &>/dev/null; then
                echo "  ✓ Secret trusted-artifact-signer-user exists"
                TAS_USER_EXISTS=true
              else
                echo "  ✗ Secret trusted-artifact-signer-user does not exist"
              fi

              if oc get secret trusted-artifact-signer-clients -n "$TAS_NAMESPACE" &>/dev/null; then
                echo "  ✓ Secret trusted-artifact-signer-clients exists"
                TAS_CLIENTS_EXISTS=true
              else
                echo "  ✗ Secret trusted-artifact-signer-clients does not exist"
              fi

              echo ""

              # Exit early if all secrets exist
              if [ "$TAS_USER_EXISTS" = true ] && [ "$TAS_CLIENTS_EXISTS" = true ]; then
                echo "All secrets already exist - skipping secret generation"
                echo "========================================"
                echo ""
                echo "Summary:"
                echo "  - Secrets already exist (skipped)"
                echo "  - Cluster domain: $INGRESS_DOMAIN"
                exit 0
              fi

              echo "Some secrets missing - proceeding with full generation"
              echo "========================================"
              echo ""

              # Function to get existing secret or generate new
              get_or_generate_password() {
                local namespace=$1
                local name=$2
                local key=$3
                local length=${4:-16}

                existing=$(oc get secret "$name" -n "$namespace" -o jsonpath="{.data.$key}" 2>/dev/null | base64 -d || echo "")
                if [ -n "$existing" ]; then
                  echo "  Reusing existing password for $name/$key" >&2
                  echo "$existing"
                else
                  echo "  Generating new password for $name/$key" >&2
                  openssl rand -base64 32 | tr -dc 'a-zA-Z0-9' | head -c "$length"
                fi
              }

              get_or_generate_uuid_password() {
                local namespace=$1
                local name=$2
                local key=$3

                existing=$(oc get secret "$name" -n "$namespace" -o jsonpath="{.data.$key}" 2>/dev/null | base64 -d || echo "")
                if [ -n "$existing" ]; then
                  echo "  Reusing existing password for $name/$key" >&2
                  echo "$existing"
                else
                  echo "  Generating new UUID-style password for $name/$key" >&2
                  random=$(openssl rand -base64 64 | tr -dc 'a-zA-Z0-9' | head -c 32)
                  echo "${random:0:8}-${random:8:4}-${random:12:4}-${random:16:4}-${random:20:12}"
                fi
              }

              # Generate or reuse passwords
              echo "Processing passwords..."
              TAS_USER_PASS=$(get_or_generate_password "$TAS_NAMESPACE" "trusted-artifact-signer-user" "password" 16)
              TAS_CLIENT_SECRET=$(get_or_generate_uuid_password "$TAS_NAMESPACE" "trusted-artifact-signer-clients" "trustedArtifactSigner")
              echo ""

              # Create all secrets
              echo "Creating secrets..."
              oc apply -f - <<EOF
              ---
              apiVersion: v1
              kind: Secret
              type: Opaque
              metadata:
                annotations:
                  helm.sh/resource-policy: keep
                labels:
                  app: keycloak
                namespace: $TAS_NAMESPACE
                name: trusted-artifact-signer-user
              stringData:
                username: trusted-artifact-signer
                password: "$TAS_USER_PASS"
              ---
              apiVersion: v1
              kind: Secret
              type: Opaque
              metadata:
                annotations:
                  helm.sh/resource-policy: keep
                labels:
                  app: keycloak
                namespace: $KEYCLOAK_NAMESPACE
                name: trusted-artifact-signer-user
              stringData:
                username: trusted-artifact-signer
                password: "$TAS_USER_PASS"
              ---
              apiVersion: v1
              kind: Secret
              type: Opaque
              metadata:
                annotations:
                  helm.sh/resource-policy: keep
                labels:
                  app: keycloak
                namespace: $TAS_NAMESPACE
                name: trusted-artifact-signer-clients
              stringdata:
                trustedArtifactSigner: "$TAS_CLIENT_SECRET"
              ---
              apiVersion: v1
              kind: Secret
              type: Opaque
              metadata:
                annotations:
                  helm.sh/resource-policy: keep
                labels:
                  app: keycloak
                namespace: $KEYCLOAK_NAMESPACE
                name: trusted-artifact-signer-clients
              stringdata:
                trustedArtifactSigner: "$TAS_CLIENT_SECRET"
              EOF
              echo "✓ All secrets created/updated"
              echo ""

              echo "========================================"
              echo "Secret generation completed successfully!"
              echo "========================================"
              echo ""
              echo "Summary:"
              echo "  - 2 Secrets created"
              echo "  - Cluster domain: $INGRESS_DOMAIN"
